# Publish to npm on push to main when there are version-worthy commits.
# Requires repo secret NPM_TOKEN (npm Automation token from https://www.npmjs.com/settings/~/tokens).
# If you use npm 2FA, set it to "Authorization only" so the token can publish.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check NPM_TOKEN
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Add it in GitHub: Settings → Secrets and variables → Actions → New repository secret."
            echo "Create a token at https://www.npmjs.com/settings/~/tokens (type: Automation, or Classic with 'Automation' scope)."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc
          npm whoami --registry https://registry.npmjs.org || (echo "::error::NPM_TOKEN is invalid or expired." && exit 1)
          rm .npmrc
          echo "NPM_TOKEN is valid"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Release
        run: npx semantic-release
